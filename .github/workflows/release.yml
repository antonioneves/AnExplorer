name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key and cloud keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_KEY: ${{ secrets.BOX_CLIENT_KEY }}
        run: |
          : > keystore.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "keyStore=release.keystore"
              echo "keyStorePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyAliasPassword=$KEY_PASSWORD"
            } >> keystore.properties
          else
            echo "::warning::No KEYSTORE_BASE64 secret: building an unsigned APK"
          fi
          for key in DROPBOX_CLIENT_ID ONEDRIVE_CLIENT_ID BOX_CLIENT_ID BOX_CLIENT_KEY; do
            [ -n "${!key}" ] && echo "$key=${!key}" >> keystore.properties
          done
          true
      - name: Release build
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: AnExplorer-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
      - name: Remove signing key
        if: always()
        run: rm -f release.keystore keystore.properties
