# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX migration for legacy support-library dependencies (libaums, needle, AppUpdater, CloudRail, etc.)
android.enableJetifier=true
android.useAndroidX=true

# Legacy project uses library resources/styles in the app R class and switch statements on R.id,
# which break under AGP 8+ defaults. Restore the pre-AGP8 resource behavior.
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Optimized resource shrinking requires non-final resource IDs; this legacy project
# relies on final IDs for switch statements on R.id. Fall back to the classic shrinking path.
android.r8.optimizedResourceShrinking=false

# Temporary opt-outs for AGP 9.x on this legacy 100%-Java project (removed in AGP 10.0).
android.newDsl=false
android.builtInKotlin=false