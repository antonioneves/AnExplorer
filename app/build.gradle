apply plugin: 'com.android.application'

def props = new Properties()
File keystoreProperties = rootProject.file("keystore.properties")
if (keystoreProperties.exists()) {
    props.load(new FileInputStream(keystoreProperties))
} else {
    props['keystorefile'] = 'none';
}

def propOrEmpty = { String key -> props.containsKey(key) ? props[key] : "" }

android {
    namespace "dev.dworks.apps.anexplorer"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.dworks.apps.anexplorer"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.generateVersionCode(1)
        versionName rootProject.generateVersionName()
        vectorDrawables.useSupportLibrary = true

        buildConfigField "String", "LICENSE_KEY", "\"${propOrEmpty('LICENSE_KEY')}\""
        buildConfigField "String", "DROPBOX_CLIENT_ID", "\"${propOrEmpty('DROPBOX_CLIENT_ID')}\""
        buildConfigField "String", "DROPBOX_CLIENT_KEY", "\"${propOrEmpty('DROPBOX_CLIENT_KEY')}\""
        buildConfigField "String", "ONEDRIVE_CLIENT_ID", "\"${propOrEmpty('ONEDRIVE_CLIENT_ID')}\""
        buildConfigField "String", "ONEDRIVE_CLIENT_KEY", "\"${propOrEmpty('ONEDRIVE_CLIENT_KEY')}\""
        buildConfigField "String", "BOX_CLIENT_ID", "\"${propOrEmpty('BOX_CLIENT_ID')}\""
        buildConfigField "String", "BOX_CLIENT_KEY", "\"${propOrEmpty('BOX_CLIENT_KEY')}\""
        buildConfigField "String", "GOOGLE_DRIVE_CLIENT_ID", "\"${propOrEmpty('GOOGLE_DRIVE_CLIENT_ID')}\""
    }
    signingConfigs {
        release {
            storeFile rootProject.file(props.keyStore)
            storePassword props.keyStorePassword
            keyAlias props.keyAlias
            keyPassword props.keyAliasPassword
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/DEPENDENCIES']
        }
        jniLibs {
            // libaums prebuilts, not 16 KB page aligned: errno-lib only decorates USB I/O error
            // messages (ErrNo falls back gracefully without it) and libusb-lib is never loaded
            // with the default Android USB API backend
            excludes += ['**/liberrno-lib.so', '**/libusb-lib.so']
        }
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':protocol')
    implementation 'com.google.protobuf:protobuf-javalite:4.36.2'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.jaredrummler:android-processes:1.1.1'
    implementation 'me.jahnen.libaums:core:0.10.0'
    implementation 'org.apache.ftpserver:ftpserver-core:1.2.1'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'com.zsoltsafrany:needle:1.0.0'
    implementation 'com.cloudrail:cloudrail-si-android:2.22.4'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.2.0'
    implementation 'com.github.javiersantos:AppUpdater:2.7'
}
