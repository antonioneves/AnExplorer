<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7F9FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)">
<title>{{title}}</title>
<style>
/* The app's own Material 3 colours, light and dark */
:root{color-scheme:light dark;--bg:#f7f9ff;--fg:#181c20;--muted:#42474e;--card:#ebeef3;--card-hi:#e0e2e8;--line:#c2c7ce;--primary:#0288d1;--link:#00639b;--on-primary:#fff;--logo:#42474e;--error:#ba1a1a}
@media(prefers-color-scheme:dark){:root{--bg:#101418;--fg:#e0e2e8;--muted:#c2c7ce;--card:#1c2024;--card-hi:#313539;--line:#42474e;--link:#9dcaff;--logo:#c2c7ce;--error:#ffb4ab}}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 32px;background:var(--bg);color:var(--fg);font:16px/1.4 Roboto,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin:0 0 20px}
header svg{width:44px;height:44px;flex:none}
header .app{font-size:1.6rem;font-weight:500;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:.95rem}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:0 0 12px;font-weight:500}
.crumbs a{color:var(--link);cursor:pointer;padding:6px 10px;border-radius:20px}
.crumbs a:last-child{background:var(--card)}
.crumbs span{color:var(--muted)}
.icon{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.icon svg{width:24px;height:24px;fill:#fff}
#drop{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;background:var(--card);outline:2px dashed transparent;outline-offset:-2px;transition:background .15s}
#drop.over{background:var(--card-hi);outline-color:var(--primary)}
#drop p{flex:1;min-width:0;margin:0;color:var(--muted)}
label{display:inline-block;padding:10px 22px;border-radius:24px;background:var(--primary);color:var(--on-primary);font-weight:500;cursor:pointer;white-space:nowrap}
label:active{filter:brightness(.9)}
input{display:none}
#list:not(:empty){margin-top:12px}
.item{display:flex;align-items:center;gap:16px;padding:10px 16px;margin-top:8px;border-radius:16px;background:var(--card)}
.item .text{flex:1;min-width:0}
.item .n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .z{display:block;color:var(--muted);font-size:.85rem}
#files-list{margin:16px 0 0;padding:0;list-style:none}
#files-list li{cursor:pointer;transition:background .15s}
#files-list li:hover,#files-list li:focus-visible{background:var(--card-hi)}
#files-list li:focus-visible{outline:3px solid var(--link);outline-offset:-3px}
#files-list li.empty{cursor:default;color:var(--muted);justify-content:center;padding:24px 16px}
#files-list li.empty:hover{background:var(--card)}
.row progress{display:block;width:100%;height:4px;margin:6px 0 2px;border:0;border-radius:2px;background:var(--line);accent-color:var(--primary);-webkit-appearance:none;appearance:none}
.row progress::-webkit-progress-bar{background:var(--line);border-radius:2px}
.row progress::-webkit-progress-value{background:var(--primary);border-radius:2px}
.row progress::-moz-progress-bar{background:var(--primary);border-radius:2px}
.row.failed progress{accent-color:var(--error)}
.row.failed progress::-webkit-progress-value{background:var(--error)}
.row.failed progress::-moz-progress-bar{background:var(--error)}
.row.failed .z{color:var(--error)}
</style>
</head>
<body data-sending="{{sending}}" data-done="{{done}}" data-failed="{{failed}}" data-root="{{root}}" data-empty="{{empty}}">
<main>
<header>
<svg viewBox="31.5 31.5 46 46" aria-hidden="true"><path fill="#EB4756" d="M53.08,41.019L51.723,39.737L61.887,39.737L71.427,39.765C71.511,39.77 71.569,39.775 71.601,39.779C71.692,39.793 71.754,39.801 71.786,39.808C71.86,39.825 71.983,39.863 72.072,39.912C72.106,39.93 72.157,39.958 72.225,39.994C72.873,40.341 73.394,40.866 73.669,41.45C73.806,41.747 73.908,42.133 73.937,42.291C73.941,42.312 66.827,42.291 64.214,42.291L54.524,42.291L53.08,41.019Z"/><path fill="var(--logo)" fill-rule="evenodd" d="M36.5,38.096L50,38.096L54.5,42.209L72.5,42.209C73.779,42.209 75.193,42.293 76.015,43.083C76.783,43.822 77,45.229 77,46.322L77,66.887C77,68.054 76.728,69.502 75.866,70.252C75.058,70.956 73.698,71 72.5,71L36.5,71C35.285,71 33.803,70.974 32.992,70.252C32.15,69.504 32,68.038 32,66.887L32.023,42.209C32.023,41.638 32,40.922 32.123,40.337C32.254,39.716 32.544,39.231 32.992,38.844C33.316,38.564 33.746,38.334 34.237,38.224C34.958,38.062 35.794,38.096 36.5,38.096ZM39.9,46.6L55.3,46.6A1.9,1.9 0 0 1 57.2,48.5L57.2,58.1A1.9,1.9 0 0 1 55.3,60L39.9,60A1.9,1.9 0 0 1 38,58.1L38,48.5A1.9,1.9 0 0 1 39.9,46.6ZM40.5,48.5L54.7,48.5A0.6,0.6 0 0 1 55.3,49.1L55.3,57.5A0.6,0.6 0 0 1 54.7,58.1L40.5,58.1A0.6,0.6 0 0 1 39.9,57.5L39.9,49.1A0.6,0.6 0 0 1 40.5,48.5ZM45.6,60L49.6,60L51.1,62L44.1,62ZM42.75,64.6L44.65,64.6L44.65,66.5L42.75,66.5ZM46.65,64.6L48.55,64.6L48.55,66.5L46.65,66.5ZM50.55,64.6L52.45,64.6L52.45,66.5L50.55,66.5Z"/></svg>
<div><div class="app">{{app}}</div><div class="sub">{{title}}</div></div>
</header>
<nav class="crumbs" id="crumbs"></nav>
<div id="drop">
<div class="icon" style="background:var(--primary)"><svg viewBox="0 0 24 24"><path d="M9,16h6v-6h4l-7,-7 -7,7h4zM5,18h14v2H5z"/></svg></div>
<label for="files">{{choose}}</label>
<input id="files" type="file" multiple>
<p>{{drop}}</p>
</div>
<div id="list"></div>
<ul id="files-list"></ul>
</main>
<script>
var cur=[],d=document.body.dataset,list=document.getElementById('list'),input=document.getElementById('files'),drop=document.getElementById('drop'),queue=Promise.resolve();
// The app's file icons and colours, picked by extension
var ICONS={
  folder:['#0288D1','0 0 24 24','M10,4H4c-1.1,0 -1.99,0.9 -1.99,2L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2h-8l-2,-2z'],
  image:['#00838F','0 0 24 24','M21,19V5c0,-1.1 -0.9,-2 -2,-2H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2zM8.5,13.5l2.5,3.01L14.5,12l4.5,6H5l3.5,-4.5z'],
  video:['#C74141','0 0 24 24','M18,4l2,4h-3l-2,-4h-2l2,4h-3l-2,-4H8l2,4H7L5,4H4c-1.1,0 -1.99,0.9 -1.99,2L2,18c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V4h-4z'],
  audio:['#FF9800','0 0 24 24','M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z'],
  apk:['#8BC34A','-2 -5 24 24','M14.286,11.071C13.497,11.071 12.857,10.415 12.857,9.607C12.857,8.798 13.497,8.142 14.286,8.142C15.075,8.142 15.714,8.798 15.714,9.607C15.714,10.415 15.075,11.071 14.286,11.071ZM5.714,11.071C4.925,11.071 4.286,10.415 4.286,9.607C4.286,8.798 4.925,8.142 5.714,8.142C6.503,8.142 7.143,8.798 7.143,9.607C7.143,10.415 6.503,11.071 5.714,11.071ZM15.886,4.291L18.886,1.215L17.714,0L14.414,3.383C13.086,2.695 11.586,2.285 10,2.285C8.4,2.285 6.914,2.695 5.586,3.383L2.286,0L1.114,1.215L4.114,4.291C1.629,6.151 0,9.138 0,12.536L0,14L20,14L20,12.536C20,9.138 18.371,6.151 15.886,4.291Z'],
  archive:['#795548','0 0 24 24','M20.54,5.23l-1.39,-1.68C18.88,3.21 18.47,3 18,3H6c-0.47,0 -0.88,0.21 -1.16,0.55L3.46,5.23C3.17,5.57 3,6.02 3,6.5V19c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V6.5c0,-0.48 -0.17,-0.93 -0.46,-1.27zM12,17.5L6.5,12H10v-2h4v2h3.5L12,17.5zM5.12,5l0.81,-1h12l0.94,1H5.12z'],
  pdf:['#DB4437','-3 -3 24 24','M16,0L2,0C0.9,0 0,0.9 0,2L0,16C0,17.1 0.9,18 2,18L16,18C17.1,18 18,17.1 18,16L18,2C18,0.9 17.1,0 16,0ZM9.5,10.5L10.5,10.5L10.5,7.5L9.5,7.5L9.5,10.5ZM7,8.5C7,9.33 6.33,10 5.5,10L4.5,10L4.5,12L3,12L3,6L5.5,6C6.33,6 7,6.67 7,7.5L7,8.5ZM12,10.5C12,11.33 11.33,12 10.5,12L8,12L8,6L10.5,6C11.33,6 12,6.67 12,7.5L12,10.5ZM16,7.5L14.5,7.5L14.5,8.5L16,8.5L16,10L14.5,10L14.5,12L13,12L13,6L16,6L16,7.5ZM4.5,8.5L5.5,8.5L5.5,7.5L4.5,7.5L4.5,8.5Z'],
  word:['#4883F3','0 0 24 24','M14,17H7V15H14M17,13H7V11H17M17,9H7V7H17M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0,0 0,5 21H19A2,2 0,0 0,21 19V5C21,3.89 20.1,3 19,3Z'],
  sheet:['#16A765','0 0 24 24','M14,17H7V15H14M17,13H7V11H17M17,9H7V7H17M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0,0 0,5 21H19A2,2 0,0 0,21 19V5C21,3.89 20.1,3 19,3Z'],
  slide:['#F4B400','0 0 24 24','M14,17H7V15H14M17,13H7V11H17M17,9H7V7H17M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0,0 0,5 21H19A2,2 0,0 0,21 19V5C21,3.89 20.1,3 19,3Z'],
  text:['#607D8B','0 0 24 24','M14,2L6,2c-1.1,0 -1.99,0.9 -1.99,2L4,20c0,1.1 0.89,2 1.99,2L18,22c1.1,0 2,-0.9 2,-2L20,8l-6,-6zM16,18L8,18v-2h8v2zM16,14L8,14v-2h8v2zM13,9L13,3.5L18.5,9L13,9z'],
  file:['#808080','0 0 24 24','M6,2c-1.1,0 -1.99,0.9 -1.99,2L4,20c0,1.1 0.89,2 1.99,2L18,22c1.1,0 2,-0.9 2,-2L20,8l-6,-6L6,2zM13,9L13,3.5L18.5,9L13,9z']
};
var KINDS={image:'jpg jpeg png gif webp heic heif bmp svg tif tiff avif',video:'mp4 mkv avi mov webm m4v ts m2ts wmv flv 3gp mpg mpeg',
  audio:'mp3 m4a flac ogg oga opus wav aac wma mka',apk:'apk apks xapk',archive:'zip rar 7z tar gz tgz bz2 xz',pdf:'pdf',
  word:'doc docx odt rtf',sheet:'xls xlsx ods csv',slide:'ppt pptx odp',text:'txt md log srt ass vtt json xml html htm ini cfg nfo'};
function kind(name,dir){if(dir)return'folder';var e=name.lastIndexOf('.')<0?'':name.slice(name.lastIndexOf('.')+1).toLowerCase();
  for(var k in KINDS)if((' '+KINDS[k]+' ').indexOf(' '+e+' ')>=0)return k;return'file'}
function icon(k){var i=ICONS[k],s=document.createElement('div');s.className='icon';s.style.background=i[0];
  s.innerHTML='<svg viewBox="'+i[1]+'"><path d="'+i[2]+'"/></svg>';return s}
function item(tag,k,name,sub){var el=document.createElement(tag),t=document.createElement('div'),n=document.createElement('span'),z=document.createElement('span');
  el.className='item';t.className='text';n.className='n';n.textContent=name;z.className='z';z.textContent=sub;
  t.appendChild(n);t.appendChild(z);el.appendChild(icon(k));el.appendChild(t);return el}
function send(file,dest){
  return new Promise(function(resolve){
    var row=item('div',kind(file.name),file.name,d.sending);row.classList.add('row');
    var bar=document.createElement('progress'),st=row.querySelector('.z');bar.max=100;bar.value=0;
    row.querySelector('.text').insertBefore(bar,st);list.insertBefore(row,list.firstChild);
    var x=new XMLHttpRequest(),f=new FormData();
    f.append('file',file,file.name);
    x.upload.onprogress=function(e){if(e.lengthComputable)bar.value=e.loaded*100/e.total};
    var here=dest.join('/');x.onload=function(){var ok=x.status==200;st.textContent=ok?d.done:d.failed;if(ok)bar.value=100;else row.classList.add('failed');if(here==cur.join('/'))show();resolve()};
    x.onerror=function(){st.textContent=d.failed;row.classList.add('failed');resolve()};
    x.open('POST','/upload?path='+enc(dest));x.send(f);
  });
}
function enc(p){return encodeURIComponent(p.join('/'))}
function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(1)+' GB'}
function go(p){cur=p;show()}
function crumbs(){var c=document.getElementById('crumbs');c.textContent='';
  [d.root].concat(cur).forEach(function(n,i){
    if(i){var s=document.createElement('span');s.textContent='›';c.appendChild(s)}
    var a=document.createElement('a');a.textContent=n;a.onclick=function(){go(cur.slice(0,i))};c.appendChild(a)})}
function show(){var at=cur.slice();crumbs();
  var x=new XMLHttpRequest();x.open('GET','/list?path='+enc(cur));
  x.onload=function(){if(at.join('/')!=cur.join('/'))return;
    var ul=document.getElementById('files-list');ul.textContent='';
    var items=x.status==200?JSON.parse(x.responseText):[];
    if(!items.length){var e=document.createElement('li');e.className='item empty';e.textContent=d.empty;ul.appendChild(e)}
    items.forEach(function(it){var li=item('li',kind(it.name,it.dir),it.name,it.dir?'':size(it.size));li.tabIndex=0;
      li.onclick=function(){if(it.dir)go(cur.concat([it.name]));else location.href='/download?path='+enc(cur.concat([it.name]))};
      li.onkeydown=function(e){if(e.key=='Enter')li.onclick()};
      ul.appendChild(li)})};
  x.send()}
function add(files){var dest=cur.slice();Array.prototype.forEach.call(files,function(f){queue=queue.then(function(){return send(f,dest)})})}
input.onchange=function(){add(input.files);input.value=''};
drop.ondragover=function(e){e.preventDefault();drop.className='over'};
drop.ondragleave=function(){drop.className=''};
drop.ondrop=function(e){e.preventDefault();drop.className='';add(e.dataTransfer.files)};
show();
</script>
</body>
</html>
