apply plugin: 'com.android.library'

// Opens files inside the app: the video and audio player, and the previews of images, PDFs,
// text and Office documents. Titles, resume points, Watch Next and subtitle search come from
// the app through Viewer.Host.
android {
    namespace "dev.dworks.apps.anexplorer.viewer"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles 'consumer-rules.pro'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.google.android.material:material:1.14.0'
    // Embedded player; the ffmpeg decoder adds the audio codecs ExoPlayer lacks (DTS, AC3, ...)
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.8.0+1'
    // Plays what ExoPlayer can't read (AVI, WMV, APE, ...); LGPL, so it stays a separate library
    implementation 'org.videolan.android:libvlc-all:3.7.7'
}
